
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Le Voci del Cerchio</title>
    <style>
        body {
            margin: 0;
            background: black url('images/sfondo-etereo.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Cinzel', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        #phrase {
            font-size: 2em;
            max-width: 80%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="phrase"></div>
    <audio id="bg-music" autoplay loop>
        <source src="audio/musica.mp3" type="audio/mpeg">
    </audio>
    <script>
        const phrases = [
            "Voglio vivere un sogno.",
            "Sono stanco di vivere.",
            "Vorrei ascoltare.",
            "Mi piacerebbe vivere in armonia.",
            "Sono alla ricerca della verità.",
            "Cerco un luogo dove gli uomini veri possano realizzarsi.",
            "Essere protagonista.",
            "Basta con tutto questo marciume.",
            "Vorrei una taverna con molto da bere e da mangiare con tavoli imbanditi dove comporre musica, scolpire, dipingere, amare, accarezzare l’anima dei tuoi simili ognuno con le proprie idee, sogni, progetti, visioni.",
            "Vivere annullando la noia. Tornare a ridere e a respirare voglia di esistere.",
            "Desidero un progresso verso l'alto.",
            "Mi piacerebbe vivere una vita piena e ricca di ideali.",
            "Non ne posso più di tutta questa solitudine e tristezza.",
            "Sento che qualcosa mi chiama, ma non so ancora da dove.",
            "Ho bisogno di appartenere, ma non voglio rinunciare a me stesso.",
            "Ogni notte sogno un fuoco antico. Forse è tempo di seguirlo.",
            "La vita fuori è rumorosa, ma dentro c'è un silenzio che mi parla.",
            "Non cerco risposte. Cerco qualcuno che non abbia paura delle domande."
        ];
        let index = 0;
        const phraseBox = document.getElementById("phrase");

        function showPhrase() {
            phraseBox.style.opacity = 0;
            setTimeout(() => {
                phraseBox.textContent = phrases[index];
                phraseBox.style.opacity = 1;
                index++;
                if (index < phrases.length) {
                    setTimeout(showPhrase, 6000);
                } else {
                    setTimeout(() => {
                        window.location.href = "pagina3.html";
                    }, 8000);
                }
            }, 1000);
        }
        window.onload = showPhrase;
    </script>
</body>
</html>
