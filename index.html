
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Voci del Cerchio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black url('images/sfondo-etereo.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Cinzel', serif;
            color: white;
            text-align: center;
        }
        .centered {
            margin-top: 20vh;
            padding: 2em;
        }
        .centered img {
            width: 200px;
            margin-bottom: 2em;
        }
        .intro {
            font-size: 1.5em;
            margin-bottom: 2em;
        }
        button {
            font-size: 1.2em;
            padding: 0.5em 1em;
            background: transparent;
            border: 2px solid white;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="centered">
        <img src="images/cerchio-di-kaor.png" alt="Simbolo">
        <div class="intro">
            Le parole che leggerete non sono nostre.<br>
            Sono vostre. Siete stati voi a pronunciarle,<br>
            a scriverle, a lasciarle risuonare nel Cerchio.<br>
            Noi ci siamo limitati ad ascoltare.
        </div>
        <button onclick="startExperience()">🎧 Ascolta e rifletti</button>
    </div>
    <audio id="bg-music" loop>
        <source src="audio/musica.mp3" type="audio/mpeg">
        Il tuo browser non supporta l'audio HTML5.
    </audio>
    <script>
        function startExperience() {
            document.getElementById('bg-music').play();
            window.location.href = "pagina2.html";
        }
    </script>
</body>
</html>
