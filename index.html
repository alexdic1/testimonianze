<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voci del Cerchio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: #f0e6d2;
      font-family: 'Cinzel', serif;
      overflow: hidden;
    }
    .fullscreen {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: url('sfondo-etereo.png') no-repeat center center/cover;
      text-align: center;
      padding: 2rem;
      box-sizing: border-box;
    }
    .symbol {
      max-width: 200px;
      margin-bottom: 2rem;
      animation: fadeIn 3s ease-in-out;
    }
    .message {
      font-size: 1.5rem;
      max-width: 800px;
      opacity: 0;
      animation: fadeIn 3s ease-in-out forwards;
      animation-delay: 1s;
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }
    #overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #f0e6d2;
    }
    #overlay button {
      margin-top: 20px;
      padding: 1rem 2rem;
      background: none;
      border: 2px solid #f0e6d2;
      color: #f0e6d2;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    #overlay button:hover {
      background: #f0e6d2;
      color: black;
    }
  </style>
</head>
<body>

<div id="overlay">
  <img src="cerchio-di-kaor.png" alt="Cerchio di Kaor" class="symbol">
  <p>Le parole che leggerete non sono nostre.<br>Sono vostre. Le avete pronunciate. Noi abbiamo solo ascoltato.</p>
  <button onclick="start()">🎧 Ascolta e rifletti</button>
</div>

<div class="fullscreen" id="main" style="display: none;">
  <div class="message" id="messageBox">Trasforma le tue parole in azione.</div>
</div>

<audio id="bg-music" src="audio.mp3" loop></audio>

<script>
  const messages = [
    "Voglio vivere un sogno.",
    "Sono stanco di vivere.",
    "Vorrei ascoltare.",
    "Mi piacerebbe vivere in armonia.",
    "Sono alla ricerca della verità.",
    "Cerco un luogo dove gli uomini veri possano realizzarsi.",
    "Essere protagonista.",
    "Basta con tutto questo marciume.",
    "Vorrei una taverna con molto da bere e da mangiare, con tavoli imbanditi dove comporre musica, scolpire, dipingere, amare, accarezzare l’anima dei tuoi simili, ognuno con le proprie idee, sogni, progetti, visioni.",
    "Vivere annullando la noia. Tornare a ridere e a respirare voglia di esistere.",
    "Desidero un progresso verso l’alto.",
    "Mi piacerebbe vivere una vita piena e ricca di ideali.",
    "Non ne posso più di tutta questa solitudine e tristezza.",
    "Sento che qualcosa mi chiama, ma non so ancora da dove.",
    "Ho bisogno di appartenere, ma non voglio rinunciare a me stesso.",
    "Ogni notte sogno un fuoco antico. Forse è tempo di seguirlo.",
    "La vita fuori è rumorosa, ma dentro c'è un silenzio che mi parla.",
    "Non cerco risposte. Cerco qualcuno che non abbia paura delle domande."
  ];

  let index = 0;
  const messageBox = document.getElementById("messageBox");

  function start() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("main").style.display = "flex";
    document.getElementById("bg-music").play();
    showMessage();
  }

  function showMessage() {
    if (index < messages.length) {
      messageBox.style.opacity = 0;
      setTimeout(() => {
        messageBox.textContent = messages[index];
        messageBox.style.opacity = 1;
        index++;
        setTimeout(showMessage, 6000);
      }, 500);
    } else {
      setTimeout(() => {
        window.location.href = "https://www.renaissancekingdoms.com/FichePersonnage.php?login=ispanicoii";
      }, 7000);
    }
  }
</script>

</body>
</html>
